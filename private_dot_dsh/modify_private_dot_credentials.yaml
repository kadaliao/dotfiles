#!/usr/bin/env python3
import os
import sys

# Make PyYAML available no matter which `python3` is first in PATH. Homebrew
# Pythons are externally-managed and drop pip-installed packages on upgrade,
# so fall back to a persistent venv that owns its own PyYAML.
def _ensure_yaml():
    try:
        import yaml  # noqa: F401
    except ImportError:
        import subprocess
        venv = os.path.expanduser("~/.cache/chezmoi/yaml-venv")
        py = os.path.join(venv, "bin", "python3")
        if not os.path.isfile(py):
            subprocess.run([sys.executable, "-m", "venv", "--clear", venv], check=True)
            subprocess.run([py, "-m", "pip", "install", "--disable-pip-version-check", "--quiet", "PyYAML"], check=True)
        os.execv(py, [py, sys.argv[0]])

_ensure_yaml()

import shlex
import yaml
from pathlib import Path

x=yaml.safe_load(sys.stdin) or {"version":1}
env={}
for line in (Path.home()/".reasonix/.env").read_text().splitlines():
 if line.strip() and not line.lstrip().startswith("#") and "=" in line:
  name,value=line.split("=",1);env[name.strip().removeprefix("export ")]=shlex.split(value)[0]
key=env["ONEAPI_DOUBAN_API_KEY"]
x.setdefault("refs",{})["DOUBAN_ONEAPI_API_KEY"]=key
print(yaml.safe_dump(x,allow_unicode=True,sort_keys=False),end="")
