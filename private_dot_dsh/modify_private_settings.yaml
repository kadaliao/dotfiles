#!/usr/bin/env python3
import sys,yaml
x=yaml.safe_load(sys.stdin) or {}
x["agent-default-model"]={"provider":"douban-oneapi","model":"deepseek-flash"}
p=x.setdefault("llm-pi-ai",{}).setdefault("providers",{})
one=p.setdefault("douban-oneapi",{})
one.update(displayName="Douban OneAPI",apiKeyEnv="DOUBAN_ONEAPI_API_KEY",api="openai-completions",baseURL="https://oneapi.sapps.douban/v1")
one.setdefault("compat",{})["supportsDeveloperRole"]=False
models=one.setdefault("models",[])
def upsert(mid,name,image=False):
 e=next((v for v in models if v["id"]==mid),None)
 if e is None:
  e={"id":mid};models.append(e)
 e.update(name=name,contextWindow=1000000,maxTokens=384000,reasoningEfforts={"low":"low","high":"high","max":"max"})
 if image: e["input"]=["text","image"]
upsert("deepseek-flash","DeepSeek Flash",True)
upsert("deepseek-v4-flash","DeepSeek V4 Flash")
upsert("deepseek-v4-flash-vision-exp","DeepSeek V4 Flash Vision Exp",True)
upsert("deepseek-v4-pro","DeepSeek V4 Pro")
sel=x.get("subagent-model-selection")
if isinstance(sel,dict):
 allowed=sel.setdefault("allowedModels",[])
 if not any(v.get("provider")=="douban-oneapi" and v.get("model")=="deepseek-flash" for v in allowed if isinstance(v,dict)):
  allowed.insert(0,{"provider":"douban-oneapi","model":"deepseek-flash"})
print(yaml.safe_dump(x,allow_unicode=True,sort_keys=False),end="")
